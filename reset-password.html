<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SouthCoast Eats — Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;margin:0;background:#f5f7f8;color:#243746}main{max-width:520px;margin:60px auto;padding:20px}.card{background:#fff;border:1px solid #dbe3e7;border-radius:16px;padding:24px}input{display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0 16px;border:1px solid #ccd6dc;border-radius:9px}button{border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer;background:#5b9b96;color:#fff}.error{background:#fff0f0;padding:10px;border-radius:9px}.ok{background:#eef8f5;padding:10px;border-radius:9px}.hidden{display:none}
</style></head><body><main><div class="card"><h1>Reset Password</h1><p>Enter a new password for your SouthCoast Eats admin account.</p><div id="msg" class="hidden"></div><label>New password</label><input id="password" type="password"><label>Confirm password</label><input id="confirm" type="password"><button id="save">Update Password</button></div></main>
<script>
const SUPABASE_URL="https://wyqbqaljjnoqypynosur.supabase.co";
const SUPABASE_KEY="sb_publishable_mpZ-ZFi_MuLQYcZZh1dnHw_BQo3GGaV";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const msg=document.getElementById("msg");
document.getElementById("save").addEventListener("click",async()=>{
 const p=document.getElementById("password").value;
 const c=document.getElementById("confirm").value;
 msg.className="";
 if(!p||p.length<8){msg.className="error";msg.textContent="Password must be at least 8 characters.";return}
 if(p!==c){msg.className="error";msg.textContent="Passwords do not match.";return}
 const {error}=await sb.auth.updateUser({password:p});
 if(error){msg.className="error";msg.textContent=error.message;return}
 msg.className="ok";msg.textContent="Password updated. You can now return to the admin sign-in page.";
});
</script></body></html>
