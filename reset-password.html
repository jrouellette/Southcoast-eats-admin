<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SouthCoast Eats — Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;margin:0;background:#f5f7f8;color:#243746}header{background:#17324d;color:white;padding:18px;font-weight:800}
main{max-width:520px;margin:40px auto;padding:0 16px}.card{background:white;border:1px solid #dbe3e7;border-radius:16px;padding:22px}
input{display:block;width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccd6dc;border-radius:9px;box-sizing:border-box}
button{border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer;background:#5b9b96;color:white}
.muted{color:#6d7c87}.error{background:#fff0f0;padding:10px;border-radius:9px;margin:12px 0}.ok{background:#eef8f5;padding:10px;border-radius:9px;margin:12px 0}
a{color:#315f7e}.hidden{display:none}
</style>
</head>
<body>
<header>SouthCoast Eats · Admin</header>
<main><section class="card">
<h1>Set a new password</h1>
<p class="muted">Enter a new password for your SouthCoast Eats Admin account.</p>
<div id="message"></div>
<form id="form">
<label for="password">New password</label>
<input id="password" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirm">Confirm password</label>
<input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
<button type="submit">Update password</button>
</form>
<p><a href="./">Back to Admin Console</a></p>
</section></main>
<script>
const SUPABASE_URL="https://wyqbqaljjnoqypynosur.supabase.co";
const SUPABASE_KEY="sb_publishable_mpZ-ZFi_MuLQYcZZh1dnHw_BQo3GGaV";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const message=document.getElementById("message");
function show(text,ok=false){message.innerHTML='<div class="'+(ok?"ok":"error")+'">'+text+'</div>';}
document.getElementById("form").addEventListener("submit",async e=>{
 e.preventDefault();
 const p=document.getElementById("password").value,c=document.getElementById("confirm").value;
 if(p!==c){show("The passwords do not match.");return}
 if(p.length<8){show("Password must be at least 8 characters.");return}
 const {error}=await sb.auth.updateUser({password:p});
 if(error){show(error.message);return}
 show("Password updated. You can now sign in to the Admin Console.",true);
 document.getElementById("form").classList.add("hidden");
});
</script>
</body></html>
